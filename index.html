<!doctype html>
<html lang="ka">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ალმანახი - ჩემი საქართელო / PDF Reader</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;500;600&family=Noto+Serif+Georgian:wght@600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg1: #f7f4ee;
      --bg2: #e6edf6;
      --ink: #1c2a4d;
      --muted: #6a7590;
      --gold: #b58a2e;
      --glass: rgba(255, 255, 255, 0.46);
      --line: rgba(28, 42, 77, 0.16);
      --shadow: rgba(28, 42, 77, 0.3);
      --sk1: #efe8d8;
      --sk2: #f8f3e6;
      box-sizing: border-box;
      color-scheme: light;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        color-scheme: dark;
        --bg1: #1a1f2e;
        --bg2: #10141f;
        --ink: #eef1f8;
        --muted: #9aa5c0;
        --gold: #d9b25a;
        --glass: rgba(24, 29, 44, 0.5);
        --line: rgba(255, 255, 255, 0.18);
        --shadow: rgba(0, 0, 0, 0.65);
        --sk1: #2a3047;
        --sk2: #353c58;
      }
    }
    html {
      height: 100%;
      scroll-padding-top: env(safe-area-inset-top, 0px);
    }
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(120% 90% at 50% 0%, var(--bg1), var(--bg2));
      color: var(--ink);
      font-family: "Noto Sans Georgian", system-ui, sans-serif;
      overscroll-behavior: none;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
    #app {
      position: fixed;
      left: 0;
      top: 0;
      width: 100%;
      height: 100vh;
      height: 100dvh;
    }
    #stage {
      position: absolute;
      inset: 0;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #zoom {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1);
    }
    #zoom.mv {
      will-change: transform;
    }
    #wrap {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 100%;
      max-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px;
    }
    #book {
      width: 100% !important;
      height: 100% !important;
      filter: drop-shadow(0 14px 22px var(--shadow));
    }
    body.full #book {
      filter: none;
    }
    .page {
      background: var(--sk2);
      overflow: hidden;
      position: relative;
    }
    .page::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(100deg, var(--sk1) 30%, var(--sk2) 50%, var(--sk1) 70%);
      background-size: 220% 100%;
      animation: sh 1.3s linear infinite;
    }
    .page::after {
      content: attr(data-n);
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      font: 600 clamp(22px, 6vw, 44px)/1 "Noto Serif Georgian", serif;
      color: var(--muted);
      opacity: 0.45;
    }
    .page.ready::before, .page.ready::after {
      display: none;
    }
    .page img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      pointer-events: none;
      -webkit-user-drag: none;
      opacity: 0;
      transition: opacity 0.35s;
    }
    .page.ready img {
      opacity: 1;
    }
    @keyframes sh {
      to { background-position: -120% 0; }
    }
    #load {
      position: absolute;
      inset: 0;
      z-index: 9;
      display: grid;
      place-items: center;
      background: radial-gradient(120% 90% at 50% 0%, var(--bg1), var(--bg2));
      transition: opacity 0.6s;
      text-align: center;
    }
    #load p {
      margin: 18px 0 0;
      color: var(--muted);
      font-size: 14px;
    }
    #lbar {
      width: 150px;
      height: 3px;
      border-radius: 3px;
      background: var(--line);
      margin: 14px auto 0;
      overflow: hidden;
    }
    #lbar i {
      display: block;
      height: 100%;
      width: 8%;
      background: var(--gold);
      border-radius: 3px;
      transition: width 0.4s ease;
    }
    .bk {
      width: 84px;
      height: 60px;
      margin: 0 auto;
      position: relative;
      perspective: 400px;
    }
    .bk i {
      position: absolute;
      top: 0;
      width: 40px;
      height: 60px;
      border-radius: 3px 6px 6px 3px;
      background: var(--sk2);
      border: 1.5px solid var(--gold);
    }
    .bk i:nth-child(1) { left: 42px; }
    .bk i:nth-child(2) { left: 1px; transform: scaleX(-1); }
    .bk i:nth-child(3) {
      left: 42px;
      transform-origin: 0 50%;
      background: var(--bg1);
      animation: fl 1.5s ease-in-out infinite;
    }
    @keyframes fl {
      0% { transform: rotateY(0); }
      70%, 100% { transform: rotateY(-178deg); }
    }
    #bar {
      position: absolute;
      z-index: 10;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
      left: 50%;
      transform: translateX(-50%);
      width: fit-content;
      max-width: min(calc(100% - 24px), 480px);
      padding: 10px 16px 12px;
      overflow: hidden;
      background: var(--glass);
      backdrop-filter: blur(24px) saturate(1.8);
      -webkit-backdrop-filter: blur(24px) saturate(1.8);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 22px;
      box-shadow: 0 10px 32px -10px var(--shadow), inset 0 1px 1px rgba(255, 255, 255, 0.3);
      transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.8s;
      opacity: 1;
      visibility: visible;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    #bar.hidden {
      opacity: 0;
      visibility: hidden;
      transform: translate(-50%, 20px);
      pointer-events: none;
    }
    
    /* Title Header Row */
    #ttl {
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      text-align: center;
      color: var(--ink);
      letter-spacing: 0.2px;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }

    /* Controls Row */
    #ctrl-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
    }
    #ctrl-row button {
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--ink);
      transition: background 0.2s, transform 0.15s;
      width: 34px;
      height: 34px;
      flex-shrink: 0;
    }
    #ctrl-row button:active {
      transform: scale(0.92);
    }
    #ctrl-row button:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }
    #ctrl-row button svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      display: block;
    }
    #cnt {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      min-width: 54px;
      justify-content: center;
    }
    .sep {
      width: 1px;
      height: 18px;
      background: var(--line);
      margin: 0 2px;
    }
    #rng {
      width: 100px;
      max-width: 120px;
      accent-color: var(--gold);
      cursor: pointer;
      height: 4px;
    }
    @media (max-width: 480px) {
      #rng {
        width: 70px;
      }
      #bar {
        padding: 8px 12px 10px;
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <main id="stage">
      <div id="zoom">
        <div id="wrap">
          <!-- თუ გსურთ PDF დოკუმენტის პირდაპირ ჩაშენება ლინკით, გამოიყენეთ iframe ქვემოთ: -->
          <!-- <iframe id="pdf-container" src="YOUR_PDF_FILE.pdf"></iframe> -->
          <div id="book"></div>
        </div>
      </div>
    </main>

    <!-- მობილურის მინიშნება -->
    <div id="mobile-hint">
      <div class="hint-box">
        <svg class="swipe-icon" viewBox="0 0 24 24"><path d="M7 11.5L12 6.5L17 11.5M7 17.5L12 12.5L17 17.5" transform="rotate(90 12 12)"/></svg>
        <span>გადაფურცლეთ ან დააჭირეთ გვერდს</span>
      </div>
    </div>

    <div id="load">
      <div>
        <div class="bk"><i></i><i></i><i></i></div>
        <p>იტვირთება...</p>
        <div id="lbar"><i></i></div>
      </div>
    </div>

    <nav id="bar">
      <div id="ttl">დოკუმენტი</div>
      <div id="ctrl-row">
        <button id="prev" aria-label="წინა"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
        <span id="cnt"><span id="ct">1 / 1</span><i id="dot"></i></span>
        <button id="next" aria-label="შემდეგი"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
        <input id="rng" type="range" min="1" value="1">
        <span class="sep"></span>
        <button id="zin" aria-label="გადიდება"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2M8 11h6M11 8v6"/></svg></button>
        <button id="fs" aria-label="სრული ეკრანი"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      </div>
    </nav>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
  <script>
    // 1. ავტომატურად ვაგენერირებთ 50 გვერდის მისამართს pages/001.webp - დან pages/050.webp - ის ჩათვლით
    const PAGES = Array.from({ length: 50 }, (_, i) => {
      const pageNum = String(i + 1).padStart(3, '0');
      return `pages/${pageNum}.webp`;
    });

    const BOOK_TITLE = "ალმანახი - ჩემი საქართელო";
    document.getElementById("ttl").innerText = BOOK_TITLE;

    let pageFlip = null;
    let zoomLevel = 1;
    let barTimeout = null;

    // DOM ელემენტები
    const bookEl = document.getElementById("book");
    const loadEl = document.getElementById("load");
    const lbarInner = document.querySelector("#lbar i");
    const countEl = document.getElementById("ct");
    const dotEl = document.getElementById("dot");
    const rngEl = document.getElementById("rng");
    const prevBtn = document.getElementById("prev");
    const nextBtn = document.getElementById("next");
    const zinBtn = document.getElementById("zin");
    const fsBtn = document.getElementById("fs");
    const zoomContainer = document.getElementById("zoom");
    const barEl = document.getElementById("bar");
    const stageEl = document.getElementById("stage");
    const hintEl = document.getElementById("mobile-hint");

    // მენიუს გამოჩენა / დამალვის ლოგიკა (გლუვი დაყოვნებით)
    function showBar() {
      barEl.classList.remove("hidden");
      resetBarTimer();
    }

    function hideBar() {
      barEl.classList.add("hidden");
    }

    function toggleBar() {
      if (barEl.classList.contains("hidden")) {
        showBar();
      } else {
        hideBar();
      }
    }

    function resetBarTimer() {
      clearTimeout(barTimeout);
      // მენიუ დარჩება 10.5 წამი აქტიური, რის შემდეგაც გლუვად გაქრება
      barTimeout = setTimeout(() => {
        hideBar();
      }, 4500);
    }

    function dismissHint() {
      if (hintEl && !hintEl.classList.contains("fade-out")) {
        hintEl.classList.add("fade-out");
        setTimeout(() => hintEl.remove(), 600);
      }
    }

    // ეკრანზე დაკლიკებისას მენიუს გამოჩენა/დამალვა და მინიშნების გაქრობა
    stageEl.addEventListener("click", (e) => {
      dismissHint();
      if (!barEl.contains(e.target)) {
        toggleBar();
      }
    });

    // 5 წამში მინიშნება თავისითაც გაქრება თუ მომხმარებელს არ დაუჭერია
    setTimeout(dismissHint, 5000);

    // გვერდების დინამიური შექმნა DOM-ში
    function createPageElements() {
      bookEl.innerHTML = "";
      PAGES.forEach((src, idx) => {
        const div = document.createElement("div");
        div.className = "page";
        div.setAttribute("data-n", idx + 1);

        const img = document.createElement("img");
        img.alt = `გვერდი ${idx + 1}`;
        img.src = src;

        img.onload = () => {
          div.classList.add("ready");
          updateLoadProgress();
        };

        img.onerror = () => {
          console.warn(`ფაილი ვერ ჩაიტვირთა: ${src}`);
          div.classList.add("ready");
          updateLoadProgress();
        };

        div.appendChild(img);
        bookEl.appendChild(div);
      });

      rngEl.max = PAGES.length;
    }

    let loadedCount = 0;
    function updateLoadProgress() {
      loadedCount++;
      const pct = Math.min(100, Math.round((loadedCount / PAGES.length) * 100));
      lbarInner.style.width = `${pct}%`;

      if (loadedCount >= Math.min(3, PAGES.length)) {
        setTimeout(() => {
          loadEl.style.opacity = "0";
          setTimeout(() => loadEl.style.display = "none", 600);
          resetBarTimer();
        }, 300);
      }
    }

    // PageFlip ბიბლიოთეკის ინიციალიზაცია
    function initBook() {
      createPageElements();

      pageFlip = new St.PageFlip(bookEl, {
        width: 550,
        height: 750,
        size: "stretch",
        minWidth: 260,
        maxWidth: 1600,
        minHeight: 350,
        maxHeight: 2000,
        maxShadowOpacity: 0.4,
        showCover: true,
        mobileScrollSupport: false
      });

      pageFlip.loadFromHTML(document.querySelectorAll(".page"));

      // მოვლენების მოსმენა (Events)
      pageFlip.on("flip", (e) => {
        dismissHint();
        const current = e.data + 1;
        updateUI(current);
        resetBarTimer(); // გადაფურცვლისას ტაიმერი ახლდება, რომ ეგრევე არ გაქრეს
      });

      pageFlip.on("changeState", (e) => {
        if (e.data === "flipping") {
          dotEl.classList.remove("off");
          dismissHint();
        } else {
          dotEl.classList.add("off");
        }
      });

      updateUI(1);
    }

    function updateUI(pageNum) {
      countEl.innerText = `${pageNum} / ${PAGES.length}`;
      rngEl.value = pageNum;
      prevBtn.disabled = pageNum <= 1;
      nextBtn.disabled = pageNum >= PAGES.length;
    }

    // ღილაკების მოქმედებები
    prevBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      if (pageFlip) pageFlip.flipPrev();
    });

    nextBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      if (pageFlip) pageFlip.flipNext();
    });

    rngEl.addEventListener("input", (e) => {
      const pageNum = parseInt(e.target.value, 10) - 1;
      if (pageFlip) pageFlip.flip(pageNum);
    });

    // Zoom ფუნქციონალი
    zinBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      zoomLevel = zoomLevel === 1 ? 1.3 : 1;
      zoomContainer.style.transform = `scale(${zoomLevel})`;
      zoomContainer.classList.toggle("mv", zoomLevel > 1);
    });

    // სრული ეკრანი (Full Screen)
    fsBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    });

    // გვერდის ჩატვირთვისას გაშვება
    window.addEventListener("DOMContentLoaded", initBook);
  </script>
</body>
</html>
