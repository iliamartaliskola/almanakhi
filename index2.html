<!doctype html>
<html lang="ka">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>წიგნის ნავიგატორი / PDF Reader</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;500;600&family=Noto+Serif+Georgian:wght@600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg1: #f7f4ee;
      --bg2: #e6edf6;
      --ink: #1c2a4d;
      --muted: #6a7590;
      --gold: #b58a2e;
      --glass: rgba(255, 255, 255, 0.46);
      --line: rgba(28, 42, 77, 0.16);
      --shadow: rgba(28, 42, 77, 0.3);
      --sk1: #efe8d8;
      --sk2: #f8f3e6;
      box-sizing: border-box;
      color-scheme: light;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    /* სეპია თემა */
    [data-theme="sepia"] {
      --bg1: #f4ecd8;
      --bg2: #e8dcb8;
      --ink: #433422;
      --muted: #8c7355;
      --gold: #b57a2e;
      --glass: rgba(244, 236, 216, 0.65);
      --line: rgba(67, 52, 34, 0.18);
      --shadow: rgba(67, 52, 34, 0.35);
      --sk1: #e4d3a9;
      --sk2: #ede0bc;
    }
    /* მუქი თემა */
    [data-theme="dark"] {
      color-scheme: dark;
      --bg1: #1a1f2e;
      --bg2: #10141f;
      --ink: #eef1f8;
      --muted: #9aa5c0;
      --gold: #d9b25a;
      --glass: rgba(24, 29, 44, 0.65);
      --line: rgba(255, 255, 255, 0.18);
      --shadow: rgba(0, 0, 0, 0.65);
      --sk1: #2a3047;
      --sk2: #353c58;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]):not([data-theme="sepia"]) {
        color-scheme: dark;
        --bg1: #1a1f2e;
        --bg2: #10141f;
        --ink: #eef1f8;
        --muted: #9aa5c0;
        --gold: #d9b25a;
        --glass: rgba(24, 29, 44, 0.65);
        --line: rgba(255, 255, 255, 0.18);
        --shadow: rgba(0, 0, 0, 0.65);
        --sk1: #2a3047;
        --sk2: #353c58;
      }
    }
    html {
      height: 100%;
      scroll-padding-top: env(safe-area-inset-top, 0px);
    }
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(120% 90% at 50% 0%, var(--bg1), var(--bg2));
      color: var(--ink);
      font-family: "Noto Sans Georgian", system-ui, sans-serif;
      overscroll-behavior: none;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
    #app {
      position: fixed;
      left: 0;
      top: 0;
      width: 100%;
      height: 100vh;
      height: 100dvh;
    }
    #stage {
      position: absolute;
      inset: 0;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #zoom {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1);
    }
    #zoom.mv {
      will-change: transform;
    }
    #wrap {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 100%;
      max-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px;
    }
    /* ერთმაგი რეჟიმის დროს გვერდის სწორი მორგება */
    #wrap.single-mode #book {
      max-width: 700px;
      margin: 0 auto;
    }
    #book {
      width: 100% !important;
      height: 100% !important;
      filter: drop-shadow(0 14px 22px var(--shadow));
    }
    body.full #book {
      filter: none;
    }
    .page {
      background: var(--sk2);
      overflow: hidden;
      position: relative;
    }
    .page::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(100deg, var(--sk1) 30%, var(--sk2) 50%, var(--sk1) 70%);
      background-size: 220% 100%;
      animation: sh 1.3s linear infinite;
    }
    .page::after {
      content: attr(data-n);
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      font: 600 clamp(22px, 6vw, 44px)/1 "Noto Serif Georgian", serif;
      color: var(--muted);
      opacity: 0.45;
    }
    .page.ready::before, .page.ready::after {
      display: none;
    }
    .page img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      pointer-events: none;
      -webkit-user-drag: none;
      opacity: 0;
      transition: opacity 0.35s;
    }
    .page.ready img {
      opacity: 1;
    }
    @keyframes sh {
      to { background-position: -120% 0; }
    }
    #load {
      position: absolute;
      inset: 0;
      z-index: 9;
      display: grid;
      place-items: center;
      background: radial-gradient(120% 90% at 50% 0%, var(--bg1), var(--bg2));
      transition: opacity 0.6s;
      text-align: center;
    }
    #load p {
      margin: 18px 0 0;
      color: var(--muted);
      font-size: 14px;
    }
    #lbar {
      width: 150px;
      height: 3px;
      border-radius: 3px;
      background: var(--line);
      margin: 14px auto 0;
      overflow: hidden;
    }
    #lbar i {
      display: block;
      height: 100%;
      width: 8%;
      background: var(--gold);
      border-radius: 3px;
      transition: width 0.4s ease;
    }
    .bk {
      width: 84px;
      height: 60px;
      margin: 0 auto;
      position: relative;
      perspective: 400px;
    }
    .bk i {
      position: absolute;
      top: 0;
      width: 40px;
      height: 60px;
      border-radius: 3px 6px 6px 3px;
      background: var(--sk2);
      border: 1.5px solid var(--gold);
    }
    .bk i:nth-child(1) { left: 42px; }
    .bk i:nth-child(2) { left: 1px; transform: scaleX(-1); }
    .bk i:nth-child(3) {
      left: 42px;
      transform-origin: 0 50%;
      background: var(--bg1);
      animation: fl 1.5s ease-in-out infinite;
    }
    @keyframes fl {
      0% { transform: rotateY(0); }
      70%, 100% { transform: rotateY(-178deg); }
    }
    #bar {
      position: absolute;
      z-index: 10;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
      left: 50%;
      transform: translateX(-50%);
      width: fit-content;
      max-width: min(calc(100% - 24px), 480px);
      padding: 10px 16px 12px;
      overflow: hidden;
      background: var(--glass);
      backdrop-filter: blur(24px) saturate(1.8);
      -webkit-backdrop-filter: blur(24px) saturate(1.8);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 22px;
      box-shadow: 0 10px 32px -10px var(--shadow), inset 0 1px 1px rgba(255, 255, 255, 0.3);
      transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.8s;
      opacity: 1;
      visibility: visible;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    #bar.hidden {
      opacity: 0;
      visibility: hidden;
      transform: translate(-50%, 20px);
      pointer-events: none;
    }
    
    /* Title Header Row */
    #ttl {
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      text-align: center;
      color: var(--ink);
      letter-spacing: 0.2px;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }

    /* Controls Row */
    #ctrl-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
    }
    #ctrl-row button {
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--ink);
      transition: background 0.2s, transform 0.15s;
      width: 34px;
      height: 34px;
      flex-shrink: 0;
    }
    #ctrl-row button:active {
      transform: scale(0.92);
    }
    #ctrl-row button:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }
    #ctrl-row button svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      display: block;
    }
    #cnt {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      min-width: 54px;
      justify-content: center;
    }
    .sep {
      width: 1px;
      height: 18px;
      background: var(--line);
      margin: 0 2px;
    }
    #rng {
      width: 100px;
      max-width: 120px;
      accent-color: var(--gold);
      cursor: pointer;
      height: 4px;
    }
    @media (max-width: 480px) {
      #rng {
        width: 70px;
      }
      #bar {
        padding: 8px 12px 10px;
      }
    }

    /* Modal / Settings Dialog */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 100;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      padding: 16px;
    }
    .modal-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }
    .modal-card {
      background: var(--glass);
      backdrop-filter: blur(28px) saturate(2);
      -webkit-backdrop-filter: blur(28px) saturate(2);
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 20px 24px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 20px 40px var(--shadow);
      transform: translateY(15px) scale(0.96);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      color: var(--ink);
    }
    .modal-overlay.open .modal-card {
      transform: translateY(0) scale(1);
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }
    .modal-header h3 {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
    }
    .close-btn {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      border-radius: 50%;
    }
    .set-group {
      margin-bottom: 16px;
    }
    .set-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .set-options {
      display: flex;
      gap: 8px;
      background: rgba(0, 0, 0, 0.05);
      padding: 4px;
      border-radius: 12px;
    }
    .opt-btn {
      flex: 1;
      background: none;
      border: none;
      padding: 8px;
      font-size: 13px;
      font-weight: 500;
      color: var(--ink);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .opt-btn.active {
      background: var(--sk2);
      color: var(--gold);
      box-shadow: 0 2px 8px var(--shadow);
      font-weight: 600;
    }
    .toggle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
    }
    .toggle-row span {
      font-size: 14px;
      font-weight: 500;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      inset: 0;
      background-color: var(--line);
      border-radius: 24px;
      transition: .3s;
      cursor: pointer;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      border-radius: 50%;
      transition: .3s;
    }
    input:checked + .slider { background-color: var(--gold); }
    input:checked + .slider:before { transform: translateX(20px); }
  </style>
</head>
<body>
  <div id="app">
    <main id="stage">
      <div id="zoom">
        <div id="wrap">
          <!-- თუ გსურთ PDF დოკუმენტის პირდაპირ ჩაშენება ლინკით, გამოიყენეთ iframe ქვემოთ: -->
          <!-- <iframe id="pdf-container" src="YOUR_PDF_FILE.pdf"></iframe> -->
          <div id="book"></div>
        </div>
      </div>
    </main>

    <!-- მობილურის მინიშნება -->
    <div id="mobile-hint">
      <div class="hint-box">
        <svg class="swipe-icon" viewBox="0 0 24 24"><path d="M7 11.5L12 6.5L17 11.5M7 17.5L12 12.5L17 17.5" transform="rotate(90 12 12)"/></svg>
        <span>გადაფურცლეთ ან დააჭირეთ გვერდს</span>
      </div>
    </div>

    <div id="load">
      <div>
        <div class="bk"><i></i><i></i><i></i></div>
        <p>იტვირთება...</p>
        <div id="lbar"><i></i></div>
      </div>
    </div>

    <nav id="bar">
      <div id="ttl">დოკუმენტი</div>
      <div id="ctrl-row">
        <button id="prev" aria-label="წინა"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
        <span id="cnt"><span id="ct">1 / 1</span><i id="dot"></i></span>
        <button id="next" aria-label="შემდეგი"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
        <input id="rng" type="range" min="1" value="1">
        <span class="sep"></span>
        <button id="zin" aria-label="გადიდება"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2M8 11h6M11 8v6"/></svg></button>
        <button id="fs" aria-label="სრული ეკრანი"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
        <button id="set-btn" aria-label="პარამეტრები"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/></svg></button>
      </div>
    </nav>

    <!-- პარამეტრების ფანჯარა (Settings Modal) -->
    <div id="modal" class="modal-overlay">
      <div class="modal-card">
        <div class="modal-header">
          <h3>პარამეტრები</h3>
          <button id="close-modal" class="close-btn"><svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" fill="none" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
        </div>
        
        <div class="set-group">
          <label>თემა</label>
          <div class="set-options" id="theme-opts">
            <button class="opt-btn active" data-theme="light">ღია</button>
            <button class="opt-btn" data-theme="sepia">სეპია</button>
            <button class="opt-btn" data-theme="dark">მუქი</button>
          </div>
        </div>

        <div class="set-group">
          <label>ჩვენების რეჟიმი</label>
          <div class="set-options" id="view-opts">
            <button class="opt-btn active" data-mode="double">ორმაგი</button>
            <button class="opt-btn" data-mode="single">ერთმაგი</button>
          </div>
        </div>

        <div class="set-group">
          <div class="toggle-row">
            <span>გადაფურცვლის ხმა</span>
            <label class="switch">
              <input type="checkbox" id="sound-toggle" checked>
              <span class="slider"></span>
            </label>
          </div>
        </div>

        <div class="set-group">
          <label>ავტო-გადაფურცვლა</label>
          <div class="set-options" id="auto-opts">
            <button class="opt-btn active" data-sec="0">გამორთ.</button>
            <button class="opt-btn" data-sec="3">3წმ</button>
            <button class="opt-btn" data-sec="5">5წმ</button>
            <button class="opt-btn" data-sec="10">10წმ</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
  <script>
    // 1. ავტომატურად ვაგენერირებთ 50 გვერდის მისამართს pages/001.webp - დან pages/050.webp - ის ჩათვლით
    const PAGES = Array.from({ length: 50 }, (_, i) => {
      const pageNum = String(i + 1).padStart(3, '0');
      return `pages/${pageNum}.webp`;
    });

    const BOOK_TITLE = "ჩემი წიგნი";
    document.getElementById("ttl").innerText = BOOK_TITLE;

    let pageFlip = null;
    let zoomLevel = 1;
    let barTimeout = null;
    let autoFlipTimer = null;
    let soundEnabled = true;

    // რეალისტური რბილი ფურცლის შრიალის ხმა (Web Audio API)
    function playPaperSound() {
      if (!soundEnabled) return;
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const duration = 0.25;
        const bufferSize = ctx.sampleRate * duration;
        const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const data = buffer.getChannelData(0);

        // ნაზი, ბუნებრივი ხმაურის გენერაცია envelope-ით
        for (let i = 0; i < bufferSize; i++) {
          const t = i / bufferSize;
          // სოფტ ენველოპი (Soft envelope)
          const envelope = Math.sin(t * Math.PI);
          data[i] = (Math.random() * 2 - 1) * envelope;
        }

        const noise = ctx.createBufferSource();
        noise.buffer = buffer;

        // დაბალი სიხშირის Lowpass ფილტრი ხმაურის შესარბილებლად
        const filter = ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(1200, ctx.currentTime);
        filter.frequency.exponentialRampToValueAtTime(300, ctx.currentTime + duration);

        const gain = ctx.createGain();
        gain.gain.setValueAtTime(0.08, ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + duration);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);

        noise.start();
      } catch (e) {
        console.warn("Audio Context error:", e);
      }
    }

    // DOM ელემენტები
    const bookEl = document.getElementById("book");
    const loadEl = document.getElementById("load");
    const lbarInner = document.querySelector("#lbar i");
    const countEl = document.getElementById("ct");
    const dotEl = document.getElementById("dot");
    const rngEl = document.getElementById("rng");
    const prevBtn = document.getElementById("prev");
    const nextBtn = document.getElementById("next");
    const zinBtn = document.getElementById("zin");
    const fsBtn = document.getElementById("fs");
    const setBtn = document.getElementById("set-btn");
    const modalEl = document.getElementById("modal");
    const closeModalBtn = document.getElementById("close-modal");
    const zoomContainer = document.getElementById("zoom");
    const barEl = document.getElementById("bar");
    const stageEl = document.getElementById("stage");
    const hintEl = document.getElementById("mobile-hint");

    // მენიუს გამოჩენა / დამალვის ლოგიკა
    function showBar() {
      barEl.classList.remove("hidden");
      resetBarTimer();
    }

    function hideBar() {
      if (modalEl.classList.contains("open")) return;
      barEl.classList.add("hidden");
    }

    function toggleBar() {
      if (barEl.classList.contains("hidden")) {
        showBar();
      } else {
        hideBar();
      }
    }

    function resetBarTimer() {
      clearTimeout(barTimeout);
      barTimeout = setTimeout(() => {
        hideBar();
      }, 4500);
    }

    function dismissHint() {
      if (hintEl && !hintEl.classList.contains("fade-out")) {
        hintEl.classList.add("fade-out");
        setTimeout(() => hintEl.remove(), 600);
      }
    }

    stageEl.addEventListener("click", (e) => {
      dismissHint();
      if (!barEl.contains(e.target) && !modalEl.contains(e.target)) {
        toggleBar();
      }
    });

    setTimeout(dismissHint, 4000);

    // გვერდების დინამიური შექმნა DOM-ში
    function createPageElements() {
      bookEl.innerHTML = "";
      PAGES.forEach((src, idx) => {
        const div = document.createElement("div");
        div.className = "page";
        div.setAttribute("data-n", idx + 1);

        const img = document.createElement("img");
        img.alt = `გვერდი ${idx + 1}`;
        img.src = src;

        img.onload = () => {
          div.classList.add("ready");
          updateLoadProgress();
        };

        img.onerror = () => {
          console.warn(`ფაილი ვერ ჩაიტვირთა: ${src}`);
          div.classList.add("ready");
          updateLoadProgress();
        };

        div.appendChild(img);
        bookEl.appendChild(div);
      });

      rngEl.max = PAGES.length;
    }

    let loadedCount = 0;
    function updateLoadProgress() {
      loadedCount++;
      const pct = Math.min(100, Math.round((loadedCount / PAGES.length) * 100));
      lbarInner.style.width = `${pct}%`;

      if (loadedCount >= Math.min(3, PAGES.length)) {
        setTimeout(() => {
          loadEl.style.opacity = "0";
          setTimeout(() => loadEl.style.display = "none", 600);
          resetBarTimer();
        }, 300);
      }
    }

    // PageFlip ინიციალიზაცია
    function initBook(showCover = true) {
      createPageElements();

      const wrapEl = document.getElementById("wrap");
      if (showCover) {
        wrapEl.classList.remove("single-mode");
      } else {
        wrapEl.classList.add("single-mode");
      }

      pageFlip = new St.PageFlip(bookEl, {
        width: 550,
        height: 750,
        size: "stretch",
        minWidth: 260,
        maxWidth: 1600,
        minHeight: 350,
        maxHeight: 2000,
        maxShadowOpacity: 0.3,
        showCover: showCover,
        usePortrait: !showCover, // ერთმაგი რეჟიმისთვის პორტრეტის ჩართვა
        mobileScrollSupport: false
      });

      pageFlip.loadFromHTML(document.querySelectorAll(".page"));

      pageFlip.on("flip", (e) => {
        dismissHint();
        const current = e.data + 1;
        updateUI(current);
        resetBarTimer();
        playPaperSound();
      });

      pageFlip.on("changeState", (e) => {
        if (e.data === "flipping") {
          dotEl.classList.remove("off");
          dismissHint();
        } else {
          dotEl.classList.add("off");
        }
      });

      updateUI(1);
    }

    function updateUI(pageNum) {
      countEl.innerText = `${pageNum} / ${PAGES.length}`;
      rngEl.value = pageNum;
      prevBtn.disabled = pageNum <= 1;
      nextBtn.disabled = pageNum >= PAGES.length;
    }

    // Controls
    prevBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      if (pageFlip) pageFlip.flipPrev();
    });

    nextBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      if (pageFlip) pageFlip.flipNext();
    });

    rngEl.addEventListener("input", (e) => {
      const pageNum = parseInt(e.target.value, 10) - 1;
      if (pageFlip) pageFlip.flip(pageNum);
    });

    zinBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      zoomLevel = zoomLevel === 1 ? 1.3 : 1;
      zoomContainer.style.transform = `scale(${zoomLevel})`;
      zoomContainer.classList.toggle("mv", zoomLevel > 1);
    });

    fsBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    });

    // Modal Events
    setBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      modalEl.classList.add("open");
    });
    closeModalBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      modalEl.classList.remove("open");
    });
    modalEl.addEventListener("click", (e) => {
      if (e.target === modalEl) modalEl.classList.remove("open");
    });

    // Theme selector logic
    document.querySelectorAll("#theme-opts .opt-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll("#theme-opts .opt-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        const theme = btn.dataset.theme;
        document.documentElement.setAttribute("data-theme", theme);
      });
    });

    // View Mode Selector Logic
    document.querySelectorAll("#view-opts .opt-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll("#view-opts .opt-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        const mode = btn.dataset.mode;
        if (pageFlip) {
          const curPage = pageFlip.getCurrentPageIndex();
          pageFlip.destroy();
          initBook(mode === "double");
          setTimeout(() => {
            if (pageFlip) pageFlip.turnToPage(curPage);
          }, 100);
        }
      });
    });

    // Sound Toggle Logic
    document.getElementById("sound-toggle").addEventListener("change", (e) => {
      soundEnabled = e.target.checked;
    });

    // Auto-Flip Timer Logic
    document.querySelectorAll("#auto-opts .opt-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll("#auto-opts .opt-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        const sec = parseInt(btn.dataset.sec, 10);
        clearInterval(autoFlipTimer);
        if (sec > 0) {
          autoFlipTimer = setInterval(() => {
            if (pageFlip && pageFlip.getCurrentPageIndex() < PAGES.length - 1) {
              pageFlip.flipNext();
            } else {
              clearInterval(autoFlipTimer);
            }
          }, sec * 1000);
        }
      });
    });

    window.addEventListener("DOMContentLoaded", () => initBook(true));
  </script>
</body>
</html>
